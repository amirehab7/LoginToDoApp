
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000015;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Task</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input
                type="text"
                name="title"
                value="{{ todo.title }}"
                maxlength="200"
                required
            >
            <button type="submit">Save Changes</button>
        </form>

        <a href="/todos">Cancel</a>
    </div>
</body>
</html>
